[package]
name = "pos-minimarket"
version = "0.1.0"
description = "Sistema de punto de venta local para minimarket"
edition = "2021"

[lib]
name = "pos_minimarket_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libsql = { version = "0.9", features = ["remote"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
anyhow = "1"
reqwest = { version = "0.12", features = ["json"] }
# Solo para convertir el "entregadoAt" (UTC) que manda la delivery-app a la
# hora local de Venezuela (UTC-4 fijo, sin horario de verano) con el mismo
# formato "YYYY-MM-DD HH:MM:SS" que usa fecha_hora en toda la app — hacer
# esa aritmética de calendario a mano (meses, años bisiestos) es fácil de
# arruinar, y acá alimenta el cuadre de caja diario.
chrono = "0.4"

# Perfil de release afinado para máquinas viejas/lentas (el objetivo del
# negocio): un binario más chico carga más rápido desde un disco lento, y
# LTO + un solo codegen-unit generan código bastante más rápido a costa de
# compilar más lento en CI — un trade-off que vale la pena porque esto
# compila una sola vez por versión, no en cada arranque de la app.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# panic = "abort" quitado a propósito: con "abort", CUALQUIER panic (hasta
# uno chico, ej. un .unwrap() sobre None en un solo comando) tira abajo el
# proceso ENTERO sin aviso - con el default ("unwind"), Tauri atrapa el
# panic de un comando individual y solo esa llamada falla, en vez de
# cerrarse toda la app de golpe. Confirmado con el Visor de eventos de
# Windows: crashes reales (0xc0000005/0xc0000409) repetidos en el mismo
# punto del binario en varias versiones - el síntoma reportado ("se cierra
# solo, de la nada") coincide con esto.
strip = true
