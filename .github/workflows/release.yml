name: Publicar versión

# Se dispara al empujar un tag "vX.Y.Z" (tiene que coincidir con el
# "version" de src-tauri/tauri.conf.json). Compila para 64 y 32 bits,
# firma y publica un Release en GitHub con los instaladores y el
# latest.json que el updater de la app usa para detectar la
# actualización — ver el plan de la sesión.
on:
  push:
    tags:
      - "v*"

# Sin esto, el GITHUB_TOKEN automático viene de solo lectura y falla al
# crear/publicar el Release ("Resource not accessible by integration") —
# a nivel de workflow para que aplique a los 3 jobs, no solo a "compilar".
permissions:
  contents: write

jobs:
  crear-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.crear.outputs.result }}
    steps:
      - id: crear
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `POS Minimarket ${tag}`,
              draft: true,
              prerelease: false,
            });
            return data.id;

  compilar:
    needs: crear-release
    runs-on: windows-latest
    strategy:
      fail-fast: false
      # Uno a la vez: ambos targets escriben en el mismo latest.json del
      # Release y corriendo en paralelo se podrían pisar el uno al otro.
      max-parallel: 1
      matrix:
        # x86_64 para PCs de 64 bits (la mayoría) e i686 por si alguna
        # PC de caja resulta ser de 32 bits.
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Instalar dependencias de Node
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          releaseId: ${{ needs.crear-release.outputs.release_id }}

  publicar-release:
    needs: [crear-release, compilar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.crear-release.outputs.release_id }},
              draft: false,
            });
